name: release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Publish packages to npm
        shell: bash
        run: |
          set -euo pipefail
          TAG=""
          if [ -f .changeset/pre.json ]; then
            MODE=$(node -p "require('./.changeset/pre.json').mode")
            if [ "$MODE" = "pre" ]; then
              TAG=$(node -p "require('./.changeset/pre.json').tag")
            fi
          fi
          if [ -n "$TAG" ]; then
            echo "mode pre-release aktif, dist-tag: $TAG"
          else
            echo "rilis stabil, dist-tag: latest"
          fi
          for pkg in core provider-biteship provider-komerce provider-shipper cache-memory hono; do
            dir="packages/$pkg"
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            current=$(npm view "$name@$version" version 2>/dev/null || true)
            if [ -n "$current" ]; then
              echo "skip $name@$version (sudah ter-publish)"
              continue
            fi
            echo "publish $name@$version"
            if [ -n "$TAG" ]; then
              (cd "$dir" && npm publish --provenance --access public --tag "$TAG")
            else
              (cd "$dir" && npm publish --provenance --access public)
            fi
          done
